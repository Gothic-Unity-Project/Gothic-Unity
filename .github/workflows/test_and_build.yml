name: Gothic Build Jobs

on:
  pull_request:
    types:
      - opened
      - labeled
  
env:
  HVRversion: 'v2.9.3.a-Unity-6'

jobs:
  ##########################
  # BUILD WITHOUT HVR (XRI) #
  ##########################
  # Builds the VR targets without the private HVR repo and without GOTHIC_HVR_INSTALLED. The DeveloperConfig
  # still requests the Hvr backend; VRContextBootstrap falls back to the Xri backend (XR Interaction Toolkit) when
  # HVR isn't compiled in. Same label as the HVR build, or "pipeline-test-build-xri" for this job only.
  buildWithoutHVR:
    if: ${{ github.event.label.name == 'pipeline-test-build' || github.event.label.name == 'pipeline-test-build-xri' }}
    name: Build Gothic without HVR (Xri backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            targetDevice: Windows64
          - targetPlatform: Android
            targetDevice: Pico
          - targetPlatform: Android
            targetDevice: Quest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
      # Own cache key: the Library compiled with HVR must not be reused here (and the other way round).
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Xri-${{ matrix.targetPlatform }}
          restore-keys: Library-Xri-

      - name: Remove PlayerSetting HVR symbol
        run: |
          sed -i 's/GOTHIC_HVR_INSTALLED;\?//g' ProjectSettings/ProjectSettings.asset
          if grep -q 'GOTHIC_HVR_INSTALLED' ProjectSettings/ProjectSettings.asset; then
            echo "GOTHIC_HVR_INSTALLED is still set in ProjectSettings.asset"
            exit 1
          fi
          if [ -d Assets/HurricaneVR ]; then
            echo "Assets/HurricaneVR must not exist for this build"
            exit 1
          fi

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
          buildMethod: Gothic.VR.Editor.VRBuilderActions.Perform${{ matrix.targetDevice }}Build
          # Android Keystore settings
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: Gothic.keystore
          customParameters: >
            -keystoreName "Gothic.keystore"
            -keystorePass "${{ secrets.ANDROID_KEYSTORE_PASS }}"
            -keyaliasName "${{ secrets.ANDROID_KEYALIAS_NAME }}"
            -keyaliasPass "${{ secrets.ANDROID_KEYALIAS_PASS }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Gothic-Unity-${{ matrix.targetDevice }}-Xri
          path: Builds/${{ matrix.targetDevice }}
          retention-days: 7



  #########
  # BUILD #
  #########
  buildForAllPlatforms:
    if: ${{ github.event.label.name == 'pipeline-test-build' }}
    name: Build Gothic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            targetDevice: Windows64
          - targetPlatform: Android
            targetDevice: Pico
          - targetPlatform: Android
            targetDevice: Quest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-

      ###
      # Checkout and install HurricaneVR
      ###
      # PAT_ASSET_REPO_CHECKOUT expires once per year. An Admin need to create a new one as ORG_PAT if expired.
      - name: Check out HVR .unitypackage from private repository
        uses: actions/checkout@v4
        with:
          repository: Gothic-Unity-Project/asset-dependencies
          ref: main
          path: Checkout/AssetRepo
          token: ${{ secrets.PAT_ASSET_REPO_CHECKOUT }}
      - name: Copy HVR package
        run: |
          mkdir Assets/HuricaneVR;
          mv Checkout/AssetRepo/HVR/${{env.HVRversion}}/ Assets/HurricaneVR;

      
      ###
      # Build
      ###
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
          buildMethod: Gothic.VR.Editor.VRBuilderActions.Perform${{ matrix.targetDevice }}Build
          # Android Keystore settings
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: Gothic.keystore
          customParameters: >
            -keystoreName "Gothic.keystore"
            -keystorePass "${{ secrets.ANDROID_KEYSTORE_PASS }}"
            -keyaliasName "${{ secrets.ANDROID_KEYALIAS_NAME }}"
            -keyaliasPass "${{ secrets.ANDROID_KEYALIAS_PASS }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Gothic-Unity-${{ matrix.targetDevice }}
          path: Builds/${{ matrix.targetDevice }}
          retention-days: 7
