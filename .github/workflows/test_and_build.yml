name: Gothic Build Jobs

on:
  pull_request:
    types:
      - opened
      - labeled
  
jobs:
  #########
  # BUILD #
  #########
  buildForAllPlatforms:
    if: ${{ github.event.label.name == 'pipeline-test-build' }}
    name: Build Gothic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            targetDevice: Windows64
          - targetPlatform: Android
            targetDevice: Pico
          - targetPlatform: Android
            targetDevice: Quest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
      # Same cache key as the former "build without HVR" job: its Library was compiled without HVR.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Xri-${{ matrix.targetPlatform }}
          restore-keys: Library-Xri-

      - name: Check that HVR stays out
        run: |
          if grep -q 'GOTHIC_HVR_INSTALLED' ProjectSettings/ProjectSettings.asset; then
            echo "GOTHIC_HVR_INSTALLED must not be set in ProjectSettings.asset"
            exit 1
          fi
          if [ -d Assets/HurricaneVR ]; then
            echo "Assets/HurricaneVR must not exist"
            exit 1
          fi

      ###
      # Build
      ###
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
          buildMethod: Gothic.VR.Editor.VRBuilderActions.Perform${{ matrix.targetDevice }}Build
          # Android Keystore settings
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: Gothic.keystore
          customParameters: >
            -keystoreName "Gothic.keystore"
            -keystorePass "${{ secrets.ANDROID_KEYSTORE_PASS }}"
            -keyaliasName "${{ secrets.ANDROID_KEYALIAS_NAME }}"
            -keyaliasPass "${{ secrets.ANDROID_KEYALIAS_PASS }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Gothic-Unity-${{ matrix.targetDevice }}
          path: Builds/${{ matrix.targetDevice }}
          retention-days: 7
